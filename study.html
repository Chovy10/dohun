<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>study — 신도훈</title>
<meta name="description" content="『게임회사 이야기』를 목차 순서대로 매일 읽고 읽은 날짜와 시간을 체크한 기록.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16181d;
    --ink-soft: #4b4f57;
    --line: #e3e4e7;
    --paper: #ffffff;
    --paper-alt: #f6f6f4;
    --accent: #0a7566;      /* mint ink — text / links */
    --mint: #16b8a0;        /* mint — fills / borders */
    --mint-wash: #e7f7f3;   /* mint tint background */
    --pass: #0a7566;        /* pass */
    --maxw: 1080px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 28px;
  }

  .mono {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 28px;
    max-width: var(--maxw);
    margin: 0 auto;
    gap: 16px;
  }
  .bar .name { font-weight: 700; letter-spacing: -0.01em; }
  .bar nav { display: flex; gap: 22px; }
  .bar nav a {
    text-decoration: none;
    font-size: 0.9rem;
    color: var(--ink-soft);
    transition: color .15s;
  }
  .bar nav a:hover { color: var(--ink); }

  /* ---------- hero ---------- */
  .hero {
    padding: 96px 0 72px;
    border-bottom: 1px solid var(--line);
  }
  .hero .tag {
    display: inline-block;
    margin-bottom: 26px;
    padding: 5px 12px;
    background: var(--mint-wash);
    border: 1px solid var(--mint);
    border-radius: 5px;
    color: var(--accent);
  }
  .hero h1 {
    font-size: clamp(1.9rem, 4.6vw, 3.1rem);
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -0.02em;
    max-width: 20ch;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--accent);
  }
  .hero .lede {
    margin-top: 28px;
    max-width: 54ch;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .hero .meta {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 34px;
    align-items: center;
  }
  .hero .meta .email {
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
  }

  /* ---------- section frame ---------- */
  section { padding: 72px 0; border-bottom: 1px solid var(--line); }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 40px;
  }
  .sec-head h2 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sec-head .mono { color: var(--accent); }

  /* ---------- about ---------- */
  .about-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 48px;
  }
  .about-grid p { color: var(--ink-soft); }
  .edu {
    border-left: 2px solid var(--mint);
    padding: 4px 0 4px 18px;
  }
  .edu + .edu { margin-top: 22px; }
  .edu .when { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; color: var(--ink-soft); }
  .edu .what { font-weight: 600; margin-top: 4px; }
  .edu .where { color: var(--ink-soft); font-size: 0.95rem; }

  /* ---------- QA feature card ---------- */
  .report {
    border: 1px solid var(--line);
    border-top: 3px solid var(--mint);
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
  }
  .report .rhead {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 22px;
    background: var(--paper-alt);
    border-bottom: 1px solid var(--line);
  }
  .report .rhead .id { font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; color: var(--ink-soft); }
  .status {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    padding: 3px 9px;
    border-radius: 4px;
    border: 1px solid currentColor;
  }
  .status.open { color: var(--accent); }
  .status.done { color: var(--pass); }
  .report .rbody { padding: 26px 22px 30px; }
  .report h3 { font-size: 1.15rem; font-weight: 700; }
  .report .rmeta {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: 16px 0;
  }
  .report .rmeta dt { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .report .rmeta dd { margin-top: 4px; font-size: 0.95rem; font-weight: 500; }
  .report ul { margin-top: 18px; padding-left: 18px; color: var(--ink-soft); }
  .report ul li { margin-bottom: 6px; }

  /* ---------- projects timeline ---------- */
  .timeline { display: flex; flex-direction: column; }
  .proj {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 28px;
    padding: 26px 0;
    border-top: 1px solid var(--line);
  }
  .proj:last-child { border-bottom: 1px solid var(--line); }
  .proj .period { font-family: "IBM Plex Mono", monospace; font-size: 0.82rem; color: var(--ink-soft); padding-top: 3px; }
  .proj h3 { font-size: 1.12rem; font-weight: 700; }
  .proj .role { margin-top: 6px; color: var(--ink-soft); font-size: 0.95rem; }
  .proj .note { margin-top: 12px; color: var(--ink-soft); }
  .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink-soft);
  }
  .chip.live { color: var(--pass); border-color: var(--pass); }

  /* ---------- work tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    box-shadow: inset 0 -1px 0 var(--line);
    margin-bottom: 36px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 12px 18px;
    font: inherit;
    font-weight: 600;
    color: var(--ink-soft);
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab .mono { margin-right: 8px; font-size: 0.7rem; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--mint); }
  .tab[aria-selected="true"] .mono { color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--mint); outline-offset: 2px; }

  .panel[hidden] { display: none; }
  .panel { animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .panel-intro { color: var(--ink-soft); max-width: 62ch; }
  .panel-intro strong { color: var(--ink); }
  .stats { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; }
  .stat {
    padding: 14px 20px;
    background: var(--paper-alt);
    border-left: 3px solid var(--mint);
    border-radius: 4px;
  }
  .stat b { display: block; font-size: 1.4rem; line-height: 1.3; }
  .stat span { font-size: 0.85rem; color: var(--ink-soft); }

  .doc h3 {
    margin-top: 44px;
    font-size: 1.12rem;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .doc h3 .mono { color: var(--accent); font-size: 0.72rem; }
  .doc h4 { margin-top: 24px; font-size: 1rem; font-weight: 600; }
  .doc p, .doc li { color: var(--ink-soft); }
  .doc p { margin-top: 12px; }
  .doc ul, .doc ol { margin-top: 12px; padding-left: 20px; }
  .doc li { margin-bottom: 6px; }
  .doc li ul { margin-top: 6px; }
  .doc strong { color: var(--ink); font-weight: 600; }
  .doc code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.82rem;
    background: var(--mint-wash);
    color: var(--accent);
    padding: 1px 6px;
    border-radius: 3px;
  }

  .tbl-wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  .tbl-wrap table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  .tbl-wrap th {
    text-align: left;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    font-weight: 500;
    color: var(--ink-soft);
    background: var(--paper-alt);
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .tbl-wrap td { padding: 11px 14px; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink-soft); }
  .tbl-wrap tr:first-child td { border-top: none; }
  .tbl-wrap td.k { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .tbl-wrap td.c { text-align: center; white-space: nowrap; font-family: "IBM Plex Mono", monospace; font-size: 0.84rem; }
  .tbl-wrap td.d { white-space: nowrap; font-family: "IBM Plex Mono", monospace; font-size: 0.84rem; }
  .tbl-wrap tr.total td { background: var(--mint-wash); color: var(--ink); font-weight: 700; }
  .play-table td:nth-child(4) { min-width: 300px; }
  .badge { display: inline-block; font-size: 0.78rem; color: var(--accent); background: var(--mint-wash); padding: 1px 8px; border-radius: 3px; white-space: nowrap; }

  .doc-cover {
    padding: 26px 24px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--mint);
    border-radius: 6px;
    background: var(--paper-alt);
  }
  .doc-cover h3 { margin-top: 6px; font-size: 1.35rem; }
  .doc-cover .sub { margin-top: 4px; color: var(--accent); font-weight: 500; }
  .doc-cover .mono { font-size: 0.72rem; }
  .note-small { margin-top: 10px; font-size: 0.85rem; }

  /* ---------- contact ---------- */
  .contact { border-bottom: none; }
  .contact .big {
    font-size: clamp(1.4rem, 3.4vw, 2.1rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.4;
  }
  .contact .big .email { border-bottom: 3px solid var(--mint); }

  footer {
    padding: 28px 0 48px;
    color: var(--ink-soft);
    font-size: 0.82rem;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 720px) {
    .bar nav { display: none; }
    .hero { padding: 64px 0 48px; }
    .about-grid { grid-template-columns: 1fr; gap: 32px; }
    .report .rmeta { grid-template-columns: 1fr 1fr; }
    .proj { grid-template-columns: 1fr; gap: 8px; }
    .proj .period { padding-top: 0; }
    .tab { padding: 12px 12px; }
  }

  /* ---------- sub pages ---------- */
  .bar .name { text-decoration: none; }
  .bar nav a.on { color: var(--accent); font-weight: 600; }
  .page-hero { padding: 72px 0 48px; border-bottom: 1px solid var(--line); }
  .page-hero .tag {
    display: inline-block;
    margin-bottom: 20px;
    padding: 5px 12px;
    background: var(--mint-wash);
    border: 1px solid var(--mint);
    border-radius: 5px;
    color: var(--accent);
  }
  .page-hero h1 { font-size: clamp(1.7rem, 4vw, 2.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
  .page-hero p { margin-top: 16px; max-width: 58ch; color: var(--ink-soft); }
  @media (max-width: 720px) {
    .bar nav { display: flex; gap: 14px; }
    .bar nav a.hide-sm { display: none; }
    .page-hero { padding: 48px 0 36px; }
  }

  /* ---------- study log ---------- */
  .book {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
    padding: 18px 22px;
    border: 1px solid var(--line);
    border-top: 3px solid var(--mint);
    border-radius: 6px;
    background: var(--paper-alt);
  }
  .book dt { font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .book dd { margin-top: 4px; font-weight: 600; }
  .study-table td.o { text-align: center; color: var(--accent); font-weight: 600; }
  .study-table td.x { text-align: center; color: #b4b7bd; }
  .study-table th.ctr { text-align: center; }
  .study-table tr.part td {
    background: var(--mint-wash);
    color: var(--accent);
    font-weight: 700;
    border-top: 1px solid var(--mint);
  }
  .study-table td.empty { text-align: center; padding: 36px 14px; color: var(--ink-soft); }
  @media (max-width: 720px) {
    .book { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="name" href="index.html">신도훈</a>
    <nav>
      <a href="index.html" class="hide-sm">홈</a>
      <a href="study.html" class="on" aria-current="page">study</a>
      <a href="gamePlay.html">gamePlay</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero" id="top">
    <div class="wrap">
      <span class="tag mono">study</span>
      <h1>『게임회사 이야기』 학습 기록</h1>
      <p>선정한 책을 목차 순서대로 매일 읽고, 항목마다 읽은 날짜와 걸린 시간을 체크했습니다.</p>
    </div>
  </section>

  <section style="border-bottom:none;">
    <div class="wrap doc">
      <dl class="book">
        <div><dt>도서</dt><dd>게임회사 이야기</dd></div>
        <div><dt>저자</dt><dd>이수인</dd></div>
        <div><dt>출판</dt><dd>에이콘출판 · 2005</dd></div>
        <div><dt>분량</dt><dd>259쪽</dd></div>
      </dl>

      <div class="stats">
        <div class="stat"><b id="st-days">0일</b><span>읽은 날</span></div>
        <div class="stat"><b id="st-items">0개</b><span>읽은 목차</span></div>
        <div class="stat"><b id="st-time">0분</b><span>총 읽은 시간</span></div>
      </div>

      <h3><span class="mono">01</span>목차별 읽기 체크</h3>
      <div class="tbl-wrap">
        <table class="study-table">
          <thead>
            <tr><th>장</th><th>목차</th><th class="ctr">읽음</th><th>읽은 날짜</th><th class="ctr">시간(분)</th></tr>
          </thead>
          <tbody id="study-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; width:100%;">
    <span>© 2026 신도훈</span>
    <a href="#top" style="text-decoration:none;">맨 위로 ↑</a>
  </div>
</footer>

<script>
  /*
   * 학습 기록 — 한 줄이 표의 한 행입니다.
   *   part     : 부 제목 (바뀔 때마다 구분 행이 생깁니다)
   *   chapter  : 장 제목 (같은 장의 첫 행에만 표시됩니다)
   *   title    : 학습 내용(소제목)
   *   date     : 읽은 날짜 'YYYY.MM.DD' — 아직 안 읽었으면 ''
   *   min      : 학습 시간(분)
   *
   * 예) { part: '1부', chapter: '1장 ...', title: '...', date: '2026.09.10', min: 10 },
   */
  var studyLog = [
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '너도 만드는 온라인게임', date: '2026.09.10', min: 7 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '잡지에 났다!', date: '2026.09.10', min: 8 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '게임잡지의 사정', date: '2026.09.10', min: 3 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '(캐릭터소개 1) 기획자', date: '2026.09.10', min: 4 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '밤샘의 속내', date: '2026.09.10', min: 5 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '이기는 것은 나다', date: '2026.09.10', min: 6 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '개발의 필수품', date: '2026.09.10', min: 7 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '(프리토크 #1) 야식이야기', date: '2026.09.10', min: 8 },
    { part: '1부 개발 시작', chapter: '1장 누구나 똑같은 일상', title: '좋은 동료의 요건', date: '2026.09.10', min: 3 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '새벽 4시 41분', date: '2026.09.11', min: 7 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '사원 A양의 사정', date: '2026.09.11', min: 8 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '(캐릭터소개 2) 게임개발자', date: '2026.09.11', min: 3 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '어쩌다 게임을 만들게 되었소', date: '2026.09.11', min: 4 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '병특 주세요', date: '2026.09.11', min: 5 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '병특 있냐구요?', date: '2026.09.11', min: 6 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '망하고 싶어서 망하냐', date: '2026.09.11', min: 7 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '면접 매너는 필수', date: '2026.09.11', min: 8 },
    { part: '1부 개발 시작', chapter: '2장 게임을 만드는 사람들', title: '너무 미인도 고민', date: '2026.09.11', min: 3 },

  (function () {
    var body = document.getElementById('study-body');
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function ox(v) { return v ? '<td class="o">O</td>' : '<td class="x">X</td>'; }

    if (!studyLog.length) {
      body.innerHTML = '<tr><td class="empty" colspan="5">아직 등록된 학습 기록이 없습니다.</td></tr>';
      return;
    }

    var html = '', lastPart = null, lastChapter = null, total = 0, days = {};
    studyLog.forEach(function (r) {
      if (r.part && r.part !== lastPart) {
        html += '<tr class="part"><td colspan="5">' + esc(r.part) + '</td></tr>';
        lastPart = r.part; lastChapter = null;
      }
      var ch = r.chapter !== lastChapter ? esc(r.chapter || '') : '';
      lastChapter = r.chapter;
      html += '<tr>' +
        '<td class="k">' + ch + '</td>' +
        '<td>' + esc(r.title) + '</td>' +
        ox(r.date) +
        '<td class="d">' + (r.date ? esc(r.date) : '-') + '</td>' +
        '<td class="c">' + (Number(r.min) || 0) + '</td></tr>';
      total += Number(r.min) || 0;
      if (r.date) days[r.date] = 1;
    });
    html += '<tr class="total"><td colspan="4">합계</td><td class="c">' + total + '</td></tr>';
    body.innerHTML = html;

    document.getElementById('st-days').textContent = Object.keys(days).length + '일';
    var done = studyLog.filter(function (r) { return r.date; }).length;
    document.getElementById('st-items').textContent = done + ' / ' + studyLog.length + '개';
    document.getElementById('st-time').textContent = total >= 60 ? Math.floor(total / 60) + '시간 ' + (total % 60) + '분' : total + '분';
  })();
